services:

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: train-mssql

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}

    ports:
      - "1433:1433"

    volumes:
      - sql_data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -C -Q 'SELECT 1'"
        ]
      interval: 10s
      timeout: 5s
      retries: 30


  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest

    depends_on:
      mssql:
        condition: service_healthy

    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}

    volumes:
      - ./database:/scripts

    entrypoint:
      [
        "/bin/bash",
        "/scripts/init-db.sh"
      ]


  backend:
    build: ./backend/demo/demo

    container_name: train-backend

    depends_on:
      mssql:
        condition: service_healthy

    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

    ports:
      - "8080:8080"

    restart: always


  frontend:
    build: ./frontend

    container_name: train-frontend

    depends_on:
      - backend

    ports:
      - "3000:80"

    restart: always


volumes:
  sql_data: